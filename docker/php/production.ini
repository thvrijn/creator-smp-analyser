; Production PHP settings (docker/php/Dockerfile.prod). Uploads match STREAM_MAX_UPLOAD_MB / STREAM_MAX_POST_MB.
expose_php = Off
memory_limit = 512M
upload_max_filesize = 2048M
post_max_size = 2064M
max_execution_time = 300
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
